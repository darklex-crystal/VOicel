name: Build Windows VST3 (MSVC)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # JUCE 7.0.12 (ignore si le dossier JUCE/ est deja dans le depot)
      - name: Recuperer JUCE
        shell: bash
        run: |
          if [ ! -f JUCE/CMakeLists.txt ]; then
            rm -rf JUCE
            git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE
          fi

      - name: Configurer (Visual Studio 2022, x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_DSP_TEST=ON

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Tests hors-ligne
        shell: bash
        continue-on-error: true
        run: |
          ./build/VoicelDspTest_artefacts/Release/VoicelDspTest.exe
          ./build/VoicelInstrumentTest_artefacts/Release/VoicelInstrumentTest.exe

      - name: Publier les plug-ins VST3
        uses: actions/upload-artifact@v4
        with:
          name: Voicel-VST3-Windows-MSVC
          path: |
            build/VoicelVoice_artefacts/Release/VST3
            build/VoicelMIDI_artefacts/Release/VST3
